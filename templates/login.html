{% extends "base.html" %}

{% block title %}Login - FinTrack{% endblock %}

{% block auth_content %}
<div class="auth-card glass fade-in">
    <h2 class="gradient-text" style="font-size: 2rem; margin-bottom: 0.5rem;"><i class="fas fa-sign-in-alt"></i> Login</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Welcome back! Please enter your details.</p>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 2rem;">
            <input type="checkbox" id="remember" name="remember" style="width: auto;">
            <label for="remember" style="margin-bottom: 0;">Remember me</label>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">
            Login <i class="fas fa-arrow-right"></i>
        </button>
    </form>
    
    <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem;">
        <p style="color: var(--text-muted);">Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a></p>
    </div>
</div>
{% endblock %}
