{% extends "base.html" %}

{% block title %}Manage Budget - FinTrack{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 600px; margin: 0 auto;">
    <header style="margin-bottom: 2rem;">
        <h1 style="font-size: 2.25rem;">Set Monthly Budget</h1>
        <p style="color: var(--text-muted);">Set spending limits for different categories</p>
    </header>

    <div class="glass" style="padding: 2.5rem;">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required onchange="toggleOtherCategory()">
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="other-category-group" style="display: none;">
                <label for="custom_category">Specify Category</label>
                <input type="text" id="custom_category" name="custom_category" placeholder="Enter category name">
            </div>

            <div class="form-group">
                <label for="amount">Budget Limit ($)</label>
                <input type="number" step="0.01" id="amount" name="amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="month">Month</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <i class="fas fa-calendar-alt" style="position: absolute; left: 12px; color: white; pointer-events: none;"></i>
                    <input type="month" id="month" name="month" value="{{ now_month }}" required style="padding-left: 38px;">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-save"></i> Save Budget
                </button>
                <a href="{{ url_for('transactions.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </form>
    </div>
    
    <div style="margin-top: 2rem;">
        <p style="font-size: 0.875rem; color: var(--text-muted);">
            <i class="fas fa-info-circle"></i> Budgets help you stay on track. We'll alert you when you reach 80% and 100% of your limit.
        </p>
    </div>
</div>

<script>
    function toggleOtherCategory() {
        const categorySelect = document.getElementById('category');
        const otherGroup = document.getElementById('other-category-group');
        const customInput = document.getElementById('custom_category');
        
        if (categorySelect.value === 'Other') {
            otherGroup.style.display = 'block';
            customInput.required = true;
        } else {
            otherGroup.style.display = 'none';
            customInput.required = false;
        }
    }
</script>
{% endblock %}
