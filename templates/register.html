{% extends "base.html" %}

{% block title %}Register - FinTrack{% endblock %}

{% block auth_content %}
<div class="auth-card glass fade-in">
    <h2 class="gradient-text" style="font-size: 2rem; margin-bottom: 0.5rem;"><i class="fas fa-user-plus"></i> Create Account</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Join FinTrack and start managing your finances.</p>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Create Account <i class="fas fa-check"></i>
        </button>
    </form>
    
    <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem;">
        <p style="color: var(--text-muted);">Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Login here</a></p>
    </div>
</div>
{% endblock %}
